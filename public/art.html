<!doctype html>
<!-- Verdant Drift — seeded generative art for tir-list. See art/philosophy.md -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdant Drift — tir-list generative art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      :root {
        --black: #020202;
        --evergreen: #0d2818;
        --black-forest: #04471c;
        --sea-green: #058c42;
        --malachite: #16db65;
        --mist: #d7efe0;
        --muted: #8fb8a0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(180deg, var(--evergreen), var(--black));
        min-height: 100vh;
        color: var(--mist);
      }
      .container {
        display: flex;
        min-height: 100vh;
        padding: 20px;
        gap: 20px;
      }
      .sidebar {
        width: 320px;
        flex-shrink: 0;
        background: rgba(2, 2, 2, 0.9);
        border: 1px solid var(--sea-green);
        padding: 24px;
        border-radius: 12px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .sidebar h1 {
        font-family: ui-monospace, monospace;
        font-size: 22px;
        color: var(--malachite);
        margin-bottom: 8px;
      }
      .sidebar .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 32px;
        line-height: 1.4;
      }
      .sidebar .subtitle a {
        color: var(--malachite);
      }
      .control-section {
        margin-bottom: 32px;
      }
      .control-section h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--mist);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control-section h3::before {
        content: "•";
        color: var(--malachite);
        font-weight: bold;
      }
      .seed-input {
        width: 100%;
        background: var(--black);
        color: var(--mist);
        padding: 12px;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        margin-bottom: 12px;
        border: 1px solid var(--sea-green);
        text-align: center;
      }
      .seed-input:focus {
        outline: none;
        border-color: var(--malachite);
      }
      .seed-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .control-group {
        margin-bottom: 20px;
      }
      .control-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--mist);
        margin-bottom: 8px;
      }
      .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .slider-container input[type="range"] {
        flex: 1;
        height: 4px;
        background: var(--black-forest);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
      }
      .slider-container input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: var(--malachite);
        border-radius: 50%;
        cursor: pointer;
      }
      .slider-container input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: var(--malachite);
        border-radius: 50%;
        border: none;
        cursor: pointer;
      }
      .value-display {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
        min-width: 60px;
        text-align: right;
      }
      .color-group {
        margin-bottom: 16px;
      }
      .color-group label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .color-picker-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .color-picker-container input[type="color"] {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
        padding: 0;
      }
      .color-value {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
      }
      .button {
        background: var(--sea-green);
        color: var(--black);
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
      }
      .button:hover {
        background: var(--malachite);
      }
      .button.secondary {
        background: var(--black-forest);
        color: var(--mist);
      }
      .button.secondary:hover {
        background: var(--sea-green);
        color: var(--black);
      }
      .button-row {
        display: flex;
        gap: 8px;
      }
      .button-row .button {
        flex: 1;
      }
      .canvas-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #canvas-container {
        width: 100%;
        max-width: 1000px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--sea-green);
        background: var(--black);
      }
      #canvas-container canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--muted);
        padding: 40px;
      }
      @media (max-width: 600px) {
        .container {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
        }
        .canvas-area {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h1>Verdant Drift</h1>
        <div class="subtitle">
          Seeded flow-field spores in tir-list greens.
          <a href="/">← back to catalog</a>
        </div>

        <div class="control-section">
          <h3>Seed</h3>
          <input
            type="number"
            id="seed-input"
            class="seed-input"
            value="20261118"
            onchange="updateSeed()"
          />
          <div class="seed-controls">
            <button class="button secondary" onclick="previousSeed()">
              ← Prev
            </button>
            <button class="button secondary" onclick="nextSeed()">
              Next →
            </button>
          </div>
          <button
            class="button secondary"
            onclick="randomSeedAndUpdate()"
            style="width: 100%"
          >
            ↻ Random
          </button>
        </div>

        <div class="control-section">
          <h3>Parameters</h3>
          <div class="control-group">
            <label>Spore Count</label>
            <div class="slider-container">
              <input
                type="range"
                id="sporeCount"
                min="200"
                max="6000"
                step="100"
                value="1500"
                oninput="updateParam('sporeCount', this.value)"
              />
              <span class="value-display" id="sporeCount-value">1500</span>
            </div>
          </div>
          <div class="control-group">
            <label>Flow Scale</label>
            <div class="slider-container">
              <input
                type="range"
                id="flowScale"
                min="100"
                max="1200"
                step="20"
                value="420"
                oninput="updateParam('flowScale', this.value)"
              />
              <span class="value-display" id="flowScale-value">420</span>
            </div>
          </div>
          <div class="control-group">
            <label>Flow Speed</label>
            <div class="slider-container">
              <input
                type="range"
                id="flowSpeed"
                min="20"
                max="300"
                step="5"
                value="110"
                oninput="updateParam('flowSpeed', this.value)"
              />
              <span class="value-display" id="flowSpeed-value">110</span>
            </div>
          </div>
          <div class="control-group">
            <label>Trail Persistence</label>
            <div class="slider-container">
              <input
                type="range"
                id="trailPersist"
                min="2"
                max="40"
                step="1"
                value="10"
                oninput="updateParam('trailPersist', this.value)"
              />
              <span class="value-display" id="trailPersist-value">10</span>
            </div>
          </div>
          <div class="control-group">
            <label>Spark Probability</label>
            <div class="slider-container">
              <input
                type="range"
                id="sparkProb"
                min="0"
                max="100"
                step="1"
                value="8"
                oninput="updateParam('sparkProb', this.value)"
              />
              <span class="value-display" id="sparkProb-value">8</span>
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Colors</h3>
          <div class="color-group">
            <label>Deep Canopy</label>
            <div class="color-picker-container">
              <input
                type="color"
                id="color1"
                value="#058c42"
                onchange="updateColor('color1', this.value)"
              />
              <span class="color-value" id="color1-value">#058c42</span>
            </div>
          </div>
          <div class="color-group">
            <label>Bright Drift</label>
            <div class="color-picker-container">
              <input
                type="color"
                id="color2"
                value="#16db65"
                onchange="updateColor('color2', this.value)"
              />
              <span class="color-value" id="color2-value">#16db65</span>
            </div>
          </div>
          <div class="color-group">
            <label>Rare Spark</label>
            <div class="color-picker-container">
              <input
                type="color"
                id="color3"
                value="#c9ef79"
                onchange="updateColor('color3', this.value)"
              />
              <span class="color-value" id="color3-value">#c9ef79</span>
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Actions</h3>
          <div class="button-row">
            <button class="button" onclick="regenerate()">Regenerate</button>
          </div>
          <div class="button-row" style="margin-top: 8px">
            <button class="button secondary" onclick="resetParameters()">
              Reset
            </button>
            <button class="button secondary" onclick="downloadArt()">
              Download PNG
            </button>
          </div>
        </div>
      </div>

      <div class="canvas-area">
        <div id="canvas-container">
          <div class="loading">Germinating spores…</div>
        </div>
      </div>
    </div>

    <script>
      let params = {
        seed: 20261118,
        sporeCount: 1500,
        flowScale: 420,
        flowSpeed: 110,
        trailPersist: 10,
        sparkProb: 8,
        colorPalette: ["#058c42", "#16db65", "#c9ef79"],
      };

      let defaultParams = JSON.parse(JSON.stringify(params));
      let spores = [];

      function setup() {
        let canvas = createCanvas(1200, 800);
        canvas.parent("canvas-container");
        initializeSystem();
        const loader = document.querySelector(".loading");
        if (loader) loader.style.display = "none";
      }

      function initializeSystem() {
        randomSeed(params.seed);
        noiseSeed(params.seed);
        spores = [];
        for (let i = 0; i < params.sporeCount; i++) {
          spores.push(newSpore(true));
        }
        background(2, 2, 2);
      }

      function newSpore(anywhere) {
        const edge = floor(random(4));
        let x, y;
        if (anywhere || edge === 0) {
          x = random(width);
          y = random(height);
        } else if (edge === 1) {
          x = random(width);
          y = 0;
        } else if (edge === 2) {
          x = random(width);
          y = height;
        } else if (edge === 3) {
          x = 0;
          y = random(height);
        } else {
          x = width;
          y = random(height);
        }
        return {
          p: createVector(x, y),
          v: createVector(0, 0),
          speed: 0,
          spark: random(1000) < params.sparkProb,
          life: floor(random(120, 420)),
        };
      }

      function fieldAngle(x, y) {
        const low =
          noise(x / params.flowScale, y / params.flowScale) * TWO_PI * 2;
        const high =
          noise(
            x / (params.flowScale / 6) + 500,
            y / (params.flowScale / 6) + 500
          ) * TWO_PI;
        return low * 0.75 + high * 0.25;
      }

      function draw() {
        const fade = map(params.trailPersist, 2, 40, 28, 3);
        background(2, 2, 2, fade);
        const vmax = params.flowSpeed / 60;
        for (let i = 0; i < spores.length; i++) {
          const s = spores[i];
          const a = fieldAngle(s.p.x, s.p.y);
          s.v.x += cos(a) * 0.12;
          s.v.y += sin(a) * 0.12;
          s.v.limit(vmax);
          s.p.add(s.v);
          s.speed = s.v.mag();
          s.life--;
          if (
            s.life <= 0 ||
            s.p.x < -10 ||
            s.p.x > width + 10 ||
            s.p.y < -10 ||
            s.p.y > height + 10
          ) {
            spores[i] = newSpore(false);
            continue;
          }
          stroke(pickColor(s));
          strokeWeight(1.4);
          point(s.p.x, s.p.y);
        }
      }

      function pickColor(s) {
        if (s.spark) return color(params.colorPalette[2]);
        const t = constrain(s.speed / 2.2, 0, 1);
        if (t < 0.5)
          return lerpColor(
            color("#04471c"),
            color(params.colorPalette[0]),
            t * 2
          );
        return lerpColor(
          color(params.colorPalette[0]),
          color(params.colorPalette[1]),
          (t - 0.5) * 2
        );
      }

      function updateParam(paramName, value) {
        const numeric = [
          "sporeCount",
          "flowScale",
          "flowSpeed",
          "trailPersist",
          "sparkProb",
        ];
        params[paramName] = numeric.includes(paramName) ? Number(value) : value;
        document.getElementById(paramName + "-value").textContent = value;
        if (paramName === "sporeCount") initializeSystem();
      }

      function updateColor(colorId, value) {
        const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
        params.colorPalette[idx] = value;
        document.getElementById(colorId + "-value").textContent = value;
      }

      function updateSeedDisplay() {
        document.getElementById("seed-input").value = params.seed;
      }

      function updateSeed() {
        const input = document.getElementById("seed-input");
        const newSeed = parseInt(input.value);
        if (newSeed && newSeed > 0) {
          params.seed = newSeed;
          initializeSystem();
        } else {
          updateSeedDisplay();
        }
      }

      function previousSeed() {
        params.seed = Math.max(1, params.seed - 1);
        updateSeedDisplay();
        initializeSystem();
      }

      function nextSeed() {
        params.seed = params.seed + 1;
        updateSeedDisplay();
        initializeSystem();
      }

      function randomSeedAndUpdate() {
        params.seed = Math.floor(Math.random() * 999999) + 1;
        updateSeedDisplay();
        initializeSystem();
      }

      function regenerate() {
        initializeSystem();
      }

      function resetParameters() {
        params = JSON.parse(JSON.stringify(defaultParams));
        const numeric = [
          "sporeCount",
          "flowScale",
          "flowSpeed",
          "trailPersist",
          "sparkProb",
        ];
        for (const k of numeric) {
          document.getElementById(k).value = params[k];
          document.getElementById(k + "-value").textContent = params[k];
        }
        const colors = ["color1", "color2", "color3"];
        for (let i = 0; i < 3; i++) {
          document.getElementById(colors[i]).value = params.colorPalette[i];
          document.getElementById(colors[i] + "-value").textContent =
            params.colorPalette[i];
        }
        updateSeedDisplay();
        initializeSystem();
      }

      function downloadArt() {
        saveCanvas("verdant-drift-seed-" + params.seed, "png");
      }

      window.addEventListener("load", function () {
        updateSeedDisplay();
      });
    </script>
  </body>
</html>
