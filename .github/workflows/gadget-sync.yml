name: gadget-sync
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g open-codebase-index
      - run: npx open-codebase-index status || true
