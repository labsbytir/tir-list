name: collector
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing entries"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect ${{ inputs.overwrite && '-- --overwrite' || '' }}
        env:
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: npm run collect:enrich
        env:
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: npm run validate:data
      - run: npm run generate:llms
      - run: npm run build
      - name: Commit updates
        run: |
          git config user.name "tir-collector"
          git config user.email "collector@users.noreply.github.com"
          git add catalog/ public/llms.txt public/llms/
          git status --porcelain | grep -q . || { echo "nothing to commit"; exit 0; }
          git commit -m "chore: collector update $(date -u +%F)"
          git push
