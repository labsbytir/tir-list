name: link-health
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run collect:health -- --check
        env:
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
