name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: pull and build on the server
        uses: appleboy/ssh-action@v1.2.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 150.241.230.243
          username: github-deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ""
          envs: GH_TOKEN
          script: |
            cd /srv/tir-list
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/labsbytir/tir-list.git"
            git pull --ff-only
            git remote set-url origin https://github.com/labsbytir/tir-list.git
            npm ci --no-audit --no-fund
            npm run build
            sudo systemctl restart tir-list
      - name: purge cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "content-type: application/json" \
            --data '{"purge_everything":true}'
